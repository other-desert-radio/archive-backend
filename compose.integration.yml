services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: archive_integration
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: integration
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration -d archive_integration"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrations:
    build: .
    command: bun src/db/migrate.ts latest
    environment: &api-environment
      DATABASE_URL: postgres://integration:integration@postgres:5432/archive_integration
      PORT: 3000
      BETTER_AUTH_SECRET: integration-test-secret-that-is-long-enough
      BETTER_AUTH_URL: http://api:3000
      ADMIN_BASIC_USERNAME: admin
      ADMIN_BASIC_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment: *api-environment
    depends_on:
      migrations:
        condition: service_completed_successfully

  test:
    build:
      context: .
      dockerfile: integration-tests/Dockerfile
    environment:
      E2E_BASE_URL: http://api:3000
    depends_on:
      api:
        condition: service_started
