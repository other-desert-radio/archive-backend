services:
  api:
    build:
      context: .
      args:
        ARCHIVE_RUNTIME_UID: "${ARCHIVE_RUNTIME_UID:-1000}"
        ARCHIVE_RUNTIME_GID: "${ARCHIVE_RUNTIME_GID:-1000}"
    environment:
      ARCHIVE_SITE_REPOSITORY: "${ARCHIVE_SITE_REPOSITORY:-git@github.com:other-desert-radio/archive-site.git}"
      ARCHIVE_CHECKOUT_PATH: "${ARCHIVE_CONTAINER_CHECKOUT_PATH:-/archive-site}"
      ARCHIVE_PUBLISH_BRANCH: "${ARCHIVE_PUBLISH_BRANCH:-publish-dev}"
      ARCHIVE_GIT_NAME: "${ARCHIVE_GIT_NAME:-Other Desert Radio Archive}"
      ARCHIVE_GIT_EMAIL: "${ARCHIVE_GIT_EMAIL:-archive@otherdesertradio.com}"
      ARCHIVE_PUBLISH_MODE: "${ARCHIVE_PUBLISH_MODE:-local}"
      PORT: "${PORT:?PORT is required}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}"
      BETTER_AUTH_TRUSTED_ORIGINS: "${BETTER_AUTH_TRUSTED_ORIGINS:-}"
      DATABASE_URL: "postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}"
    volumes:
      - type: bind
        source: "${ARCHIVE_CHECKOUT_PATH:?ARCHIVE_CHECKOUT_PATH is required}"
        target: "${ARCHIVE_CONTAINER_CHECKOUT_PATH:-/archive-site}"
        bind:
          create_host_path: false
    ports:
      - "${PORT:?PORT is required}:${PORT:?PORT is required}"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - archive_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  archive_postgres_data:
